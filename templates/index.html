<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Cursor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        .title {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 2rem;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
        }

        .input-container {
            width: 60%;
            margin-bottom: 2rem;
            position: relative;
            display: inline-block;
        }

        .input-bar {
            width: 100%;
            max-width: 600px;
            padding: 15px 60px 15px 20px;
            background-color: #000;
            border: 2px solid #fff;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            outline: none;
            box-shadow: 
                0 0 20px rgba(255, 255, 255, 0.3),
                inset 0 0 20px rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .input-bar:focus {
            box-shadow: 
                0 0 30px rgba(255, 255, 255, 0.5),
                inset 0 0 30px rgba(255, 255, 255, 0.2);
            border-color: #fff;
        }

        .input-bar::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .execute-icon {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .execute-icon:hover {
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
        }

        .execute-icon:active {
            transform: translateY(-50%) scale(0.95);
        }

        .execute-icon svg {
            width: 20px;
            height: 20px;
            fill: #000;
        }

        .execute-icon:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: translateY(-50%);
        }

        .execute-icon:disabled:hover {
            transform: translateY(-50%);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .output-container {
            width: 100%;
            max-width: 800px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 20px;
            min-height: 200px;
            max-height: 500px;
            overflow-y: auto;
            text-align: left;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        .output-line {
            margin-bottom: 8px;
            word-wrap: break-word;
        }

        .loading {
            display: none;
            color: #fff;
            font-style: italic;
        }

        .error {
            color: #ff6b6b;
        }

        .success {
            color: #51cf66;
        }

        .info {
            color: #74c0fc;
        }

        .warning {
            color: #ffd43b;
        }

        /* Scrollbar styling */
        .output-container::-webkit-scrollbar {
            width: 8px;
        }

        .output-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .output-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        .output-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .typing-indicator {
            display: inline-block;
            width: 8px;
            height: 16px;
            background-color: #fff;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* --- Diff review panel --- */
        .review-panel {
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            padding: 16px;
            margin: 12px 0;
            background: rgba(255, 255, 255, 0.04);
        }
        .review-title { font-weight: bold; margin-bottom: 12px; color: #74c0fc; }
        .diff-file {
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        .diff-file-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.06);
        }
        .diff-file-header input { width: 16px; height: 16px; cursor: pointer; }
        .diff-file-name { font-weight: bold; }
        .diff-status {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(116, 192, 252, 0.2);
            color: #74c0fc;
            text-transform: uppercase;
        }
        .diff-badge { font-size: 12px; margin-left: auto; }
        .diff-badge .add { color: #51cf66; }
        .diff-badge .del { color: #ff6b6b; }
        .diff-body {
            margin: 0;
            padding: 10px 12px;
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.4;
            white-space: pre;
            max-height: 300px;
        }
        .diff-line-add { color: #51cf66; }
        .diff-line-del { color: #ff6b6b; }
        .diff-line-meta { color: #74c0fc; }
        .review-actions { display: flex; gap: 12px; margin-top: 8px; }
        .review-btn {
            font-family: inherit;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #fff;
            background: #000;
            color: #fff;
            transition: all 0.2s ease;
        }
        .review-btn.primary { background: #fff; color: #000; }
        .review-btn:hover { box-shadow: 0 0 15px rgba(255, 255, 255, 0.4); }
        .review-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Not Cursor</h1>
        
        <div class="input-container">
            <input type="text" id="promptInput" class="input-bar" placeholder="Enter your prompt here..." />
            <div id="executeIcon" class="execute-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M8.59 16.59L13.17 12L8.59 7.41L10 6L16 12L10 18L8.59 16.59Z"/>
                </svg>
            </div>
        </div>
        
        <div id="loading" class="loading">Processing...</div>
        
        <div id="outputContainer" class="output-container">
            <div class="output-line">Ready to execute prompts...</div>
        </div>
    </div>

    <script>
        const promptInput = document.getElementById('promptInput');
        const executeIcon = document.getElementById('executeIcon');
        const loading = document.getElementById('loading');
        const outputContainer = document.getElementById('outputContainer');
        let eventSource = null;
        let currentJobId = null;

        function addOutputLine(text, type = 'normal') {
            const line = document.createElement('div');
            line.className = `output-line ${type}`;
            
            // Check if the text contains GitHub URLs and make them clickable
            if (text.includes('GitHub:') || text.includes('Pull Request:')) {
                const parts = text.split(': ');
                if (parts.length === 2) {
                    const label = parts[0];
                    const url = parts[1];
                    line.innerHTML = `${label}: <a href="${url}" target="_blank" style="color: #74c0fc; text-decoration: underline;">${url}</a>`;
                } else {
                    line.textContent = text;
                }
            } else {
                line.textContent = text;
            }
            
            outputContainer.appendChild(line);
            outputContainer.scrollTop = outputContainer.scrollHeight;
        }

        function clearOutput() {
            outputContainer.innerHTML = '';
        }

        function setLoading(isLoading) {
            loading.style.display = isLoading ? 'block' : 'none';
            executeIcon.disabled = isLoading;
            promptInput.disabled = isLoading;
        }

        function escapeHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function colorizeDiff(diffText) {
            if (!diffText || !diffText.trim()) return '<span>(no textual diff)</span>';
            return diffText.split('\n').map(line => {
                const safe = escapeHtml(line);
                if (line.startsWith('+++') || line.startsWith('---') || line.startsWith('@@'))
                    return `<span class="diff-line-meta">${safe}</span>`;
                if (line.startsWith('+')) return `<span class="diff-line-add">${safe}</span>`;
                if (line.startsWith('-')) return `<span class="diff-line-del">${safe}</span>`;
                return `<span>${safe}</span>`;
            }).join('\n');
        }

        async function submitDecision(approved) {
            try {
                await fetch(`/decision/${currentJobId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ approved })
                });
            } catch (e) {
                addOutputLine(`Failed to send decision: ${e.message}`, 'error');
            }
        }

        function renderReview(diffs) {
            const panel = document.createElement('div');
            panel.className = 'review-panel';

            const title = document.createElement('div');
            title.className = 'review-title';
            title.textContent = `🔍 Review ${diffs.length} proposed change(s) — pick what gets committed`;
            panel.appendChild(title);

            diffs.forEach((d, i) => {
                const file = document.createElement('div');
                file.className = 'diff-file';
                file.innerHTML = `
                    <div class="diff-file-header">
                        <input type="checkbox" data-file="${escapeHtml(d.file)}" checked />
                        <span class="diff-status">${escapeHtml(d.status)}</span>
                        <span class="diff-file-name">${escapeHtml(d.file)}</span>
                        <span class="diff-badge"><span class="add">+${d.additions}</span> <span class="del">-${d.deletions}</span></span>
                    </div>
                    <pre class="diff-body">${colorizeDiff(d.diff)}</pre>
                `;
                panel.appendChild(file);
            });

            const actions = document.createElement('div');
            actions.className = 'review-actions';
            const approveBtn = document.createElement('button');
            approveBtn.className = 'review-btn primary';
            approveBtn.textContent = 'Approve selected & commit';
            const rejectBtn = document.createElement('button');
            rejectBtn.className = 'review-btn';
            rejectBtn.textContent = 'Reject all';

            const finish = () => {
                approveBtn.disabled = true;
                rejectBtn.disabled = true;
                panel.querySelectorAll('input[type=checkbox]').forEach(cb => cb.disabled = true);
            };

            approveBtn.addEventListener('click', () => {
                const approved = Array.from(panel.querySelectorAll('input[type=checkbox]:checked'))
                    .map(cb => cb.getAttribute('data-file'));
                finish();
                addOutputLine(`Approved ${approved.length} file(s).`, 'info');
                submitDecision(approved);
            });
            rejectBtn.addEventListener('click', () => {
                finish();
                addOutputLine('Rejected all changes.', 'warning');
                submitDecision([]);
            });

            actions.appendChild(approveBtn);
            actions.appendChild(rejectBtn);
            panel.appendChild(actions);

            outputContainer.appendChild(panel);
            outputContainer.scrollTop = outputContainer.scrollHeight;
        }

        function startStreaming(jobId) {
            currentJobId = jobId;
            if (eventSource) {
                eventSource.close();
            }

            eventSource = new EventSource(`/stream/${jobId}`);

            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);

                if (data.type === 'output') {
                    let type = 'normal';
                    if (data.message.includes('❌')) type = 'error';
                    else if (data.message.includes('✅')) type = 'success';
                    else if (data.message.includes('📋') || data.message.includes('⏭️') || data.message.includes('✍️')) type = 'warning';
                    else if (data.message.includes('📁') || data.message.includes('🧠') || data.message.includes('🔍')) type = 'info';
                    else if (data.message.includes('🎉') || data.message.includes('🚀') || data.message.includes('💾')) type = 'success';

                    addOutputLine(data.message, type);
                } else if (data.type === 'review') {
                    renderReview(data.diffs || []);
                } else if (data.type === 'done') {
                    eventSource.close();
                    setLoading(false);
                    addOutputLine('Execution completed!', 'success');
                }
            };

            eventSource.onerror = function(event) {
                console.error('EventSource failed:', event);
                eventSource.close();
                setLoading(false);
                addOutputLine('Connection error. Please try again.', 'error');
            };
        }

        async function executePrompt() {
            const prompt = promptInput.value.trim();
            if (!prompt) {
                addOutputLine('Please enter a prompt', 'error');
                return;
            }

            clearOutput();
            setLoading(true);
            addOutputLine(`Executing: ${prompt}`, 'info');

            try {
                const response = await fetch('/execute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();

                if (data.error) {
                    addOutputLine(`Error: ${data.error}`, 'error');
                    setLoading(false);
                } else {
                    // Start streaming output for this specific job
                    startStreaming(data.job_id);
                }

            } catch (error) {
                addOutputLine(`Network error: ${error.message}`, 'error');
                setLoading(false);
            }
        }

        executeIcon.addEventListener('click', executePrompt);
        
        promptInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                executePrompt();
            }
        });

        // Focus on input when page loads
        promptInput.focus();
    </script>
</body>
</html>
